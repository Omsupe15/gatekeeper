[project]
name = "sysdrift"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Om", email = "omsupe15@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.7.0",
]

[project.scripts]
sysdrift = "sysdrift:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["core", "sandbox"]

