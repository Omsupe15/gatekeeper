[project]
name = "gatekeeper"
version = "0.1.0"
description = "Autonomous Semantic-to-Kernel Drift Detector for Open-Source Supply Chain Security"
readme = "README.md"
authors = [
    { name = "Om", email = "omsupe15@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
gk = "core.cli.main:main"
gatekeeper = "core.cli.main:main"
sysdrift = "core.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["core"]
asyncio_mode = "auto"

